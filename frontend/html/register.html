<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/register.css">
    <link rel="shortcut icon" href="../img/logo/koppii.ico" type="image/x-icon">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <script src="../js/server.js"></script>
    <script src="../js/register.js"></script>
    <title>Cafeteria - Koppii</title>
</head>

<body class="body" onload="displayFoods()">
    <header class="header">
        <div class="logo-container">
            <img src="../img/logo/koppii_logo.svg" alt="Logo da Cafeteria Koppii">
        </div>

        <nav class="nav">

            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./index.html#menu">Menu</a></li>
                <li><a href="./register.html">Cadastro</a></li>
            </ul>

            <div class="responsive-menu">
                <input type="text" placeholder="Buscar.." aria-label="Input de busca">

                <button commandfor="sidebar" command="show-popover">
                    <i class="fi fi-sr-menu-burger"></i>
                </button>
            </div>
        </nav>

        <aside class="sidebar" id="sidebar" popover>
            <ul>
                <li><i class="fi fi-sr-home"></i><a href="./index.html">Home</a></li>
                <li><i class="fi fi-sr-restaurant"></i></i><a href="./index.html#menu">Menu</a></li>
                <li><i class="fi fi-sr-pencil"></i><a href="./register.html">Cadastro</a></li>
            </ul>
        </aside>
    </header>

    <main class="main">

        <section class="form-section" id="formContainer"></section>

        <section id="menu" class="products-section">

            <nav class="nav-menu">
                <div class="slider"></div>

                <div class="option active" id="foodsOption" onclick="changeProduct('food')">
                    <i class="fi fi-sr-bread-loaf"></i>
                    <h2>Comidas</h2>
                </div>

                <div class="option" id="drinksOption" onclick="changeProduct('drink')">
                    <i class="fi fi-sr-mug-hot-alt"></i>
                    <h2>Bebidas</h2>
                </div>
            </nav>

            <div class="card" id="foods"></div>
            <div class="card hidden" id="drinks"></div>
        </section>
    </main>

    <footer class="footer">
        <h2>Kopppii</h2>
        <nav class="nav">
        </nav>
    </footer>

</body>

</html>
